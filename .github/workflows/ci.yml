name: CI NEXO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Pruebas Python
        run: |
          python tests/test_rules.py
          python tests/test_agents.py
          python tests/test_auth.py
          python tests/test_carga.py
      - name: Equivalencia Python-JavaScript
        run: python tests/test_equivalencia.py --require-node
      - name: Comprobadores
        run: |
          python scripts/check.py
          python scripts/check_ui.py
      - name: Sintaxis PHP
        run: |
          php -l public/api.php
          php -l public/index.php
          php -l server/router.php
  smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Dependencia MySQL
        run: python -m pip install -r backend/requirements.txt
      - name: Base de prueba
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "CREATE USER IF NOT EXISTS 'nexo_ro'@'%' IDENTIFIED BY 'ro'; CREATE USER IF NOT EXISTS 'nexo_app'@'%' IDENTIFIED BY 'app'; CREATE USER IF NOT EXISTS 'nexo_app'@'127.0.0.1' IDENTIFIED BY 'app'; CREATE USER IF NOT EXISTS 'nexo_app'@'localhost' IDENTIFIED BY 'app'; GRANT SELECT ON nexo_source.* TO 'nexo_ro'@'%'; GRANT SELECT, INSERT, UPDATE, DELETE ON nexo_app.* TO 'nexo_app'@'%'; FLUSH PRIVILEGES;"
          for f in sql/01_schema_source.sql sql/02_schema_app.sql sql/03_seed_source.sql sql/05_agentic.sql sql/06_auth.sql sql/08_usuarios_rol.sql sql/09_carga.sql sql/10_admin_audit.sql sql/07_permisos.sql; do mysql -h 127.0.0.1 -u root -proot < "$f"; done
          printf 'NEXO_INTERNAL_TOKEN=t\nNEXO_PY_URL=http://127.0.0.1:8001\nNEXO_MYSQL_HOST=127.0.0.1\nNEXO_MYSQL_PORT=3306\nNEXO_RO_USER=nexo_ro\nNEXO_RO_PASSWORD=ro\nNEXO_APP_USER=nexo_app\nNEXO_APP_PASSWORD=app\nNEXO_AI_PROVIDER=stub\n' > .env
      - name: Humo extremo a extremo
        run: |
          python backend/app.py --port 8001 & echo $! > py.pid
          php -S 127.0.0.1:8000 server/router.php & echo $! > php.pid
          sleep 4
          curl -sf http://127.0.0.1:8000/api.php?action=health
          API=http://127.0.0.1:8000/api.php
          CSRF=$(curl -s -c jar "$API?action=auth_csrf" | python -c "import sys,json;print(json.load(sys.stdin)['csrf'])")
          # Sin sesión: 401; origen ajeno: 403 (el CSRF no basta)
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{}' "$API?action=analyze")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar -H "X-CSRF-Token: $CSRF" -H 'Origin: http://evil.test' -H 'Content-Type: application/json' -d '{}' "$API?action=analyze")" = "403"
          # Rol operador: recién registrado, puede escribir (200) y el motor da índice 90
          CO=$(curl -s -c jo -b jo "$API?action=auth_csrf" | python -c "import sys,json;print(json.load(sys.stdin)['csrf'])")
          curl -sf -c jo -b jo -H "X-CSRF-Token: $CO" -H 'Content-Type: application/json' -d '{"nombre":"Operador Prueba","email":"operador@nexo.test","password":"Operador1234"}' "$API?action=auth_register" > /dev/null
          curl -sf -b jo -H "X-CSRF-Token: $CO" -H 'Content-Type: application/json' -d '{}' "$API?action=analyze" | grep -o '"indice":90'
          # Se asciende a admin y un admin asigna rol lector a la otra cuenta
          CL=$(curl -s -c jl -b jl "$API?action=auth_csrf" | python -c "import sys,json;print(json.load(sys.stdin)['csrf'])")
          RL=$(curl -sf -c jl -b jl -H "X-CSRF-Token: $CL" -H 'Content-Type: application/json' -d '{"nombre":"Lector Prueba","email":"lector@nexo.test","password":"Lector1234"}' "$API?action=auth_register")
          LID=$(printf '%s' "$RL" | python -c "import sys,json;print(json.load(sys.stdin)['user']['id'])")
          python scripts/crea_admin.py operador@nexo.test
          curl -sf -b jo -H "X-CSRF-Token: $CO" -H 'Content-Type: application/json' -d '{"rol":"lector"}' "$API?action=admin_rol&id=$LID" > /dev/null
          # El admin lista usuarios; el lector es rechazado (403) al leer y al escribir
          curl -sf -b jo "$API?action=admin_users" | grep -o '"total":[0-9]*'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jl "$API?action=admin_users")" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jl -H "X-CSRF-Token: $CL" -H 'Content-Type: application/json' -d '{}' "$API?action=analyze")" = "403"
          echo "Roles OK: operador escribe, admin lista, lector 403 en lectura y escritura."
          kill $(cat py.pid) $(cat php.pid) || true
